services:
  - type: web
    name: telegram-shop-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PICKUP_ADDRESS
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: WEBHOOK_URL
        sync: false
